<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>La course des capitales</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .run-main { max-width: 820px; padding: 8px 12px 12px; }
    .run {
      height: calc(100dvh - var(--topbar-h) - 20px);
      min-height: 480px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .run-q {
      background: var(--card);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 6px 10px;
      text-align: center;
    }
    .run-q .lbl { color: var(--muted); font-weight: 600; font-size: 0.9rem; }
    .run-q b { display: block; font-size: clamp(1.6rem, 7vw, 2.3rem); line-height: 1.15; }
    .run-body {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 8px;
    }
    .run-side { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .run-side .hud-item b { font-size: 1.15rem; }
    .track-col { display: flex; flex-direction: column; min-height: 0; gap: 6px; }
    .track-wrap {
      flex: 1;
      min-height: 0;
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow);
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      cursor: pointer;
    }
    .track-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .fail-msg { font-size: 1.15rem; margin: 14px 0 0; }
    @media (min-width: 760px) {
      .run-body { grid-template-columns: 1fr 170px; grid-template-rows: 1fr; }
      .run-side { grid-column: 2; grid-row: 1; grid-template-columns: 1fr; align-content: start; }
      .run-side .hud-item { padding: 12px 6px; }
      .run-side .hud-item b { font-size: 1.6rem; }
      .track-col { grid-column: 1; grid-row: 1; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="index.html">← Menu</a>
    <h1>🏃‍♀️ La course des capitales</h1>
    <button class="icon-btn" id="mute"></button>
  </header>
  <main id="app" class="run-main"></main>

  <script src="assets/data.js"></script>
  <script src="assets/common.js"></script>
  <script>
    const { $, esc } = Game;
    const app = $('#app');

    // Réglages du jeu (distances en mètres, vitesses en m/s).
    const FIRST_GATE = 45;
    const GATE_SPACING = 55;
    const START_SPEED = 8;
    const SPEED_UP = 1.06;
    const MAX_SPEED = 20;
    const SPRINT = 1.8;
    const LONG_PRESS_MS = 350;   // durée d'un appui long pour sprinter          // vitesse multipliée pendant un sprint (jusqu'à la prochaine haie)
    const VIEW_METERS = 40;      // hauteur de piste visible à l'écran
    const RUNNER_Y = 0.8;        // position verticale de la coureuse (fraction de la hauteur)
    const GRASS = 0.07;          // bande d'herbe de chaque côté
    const LANE_COLORS = ['#4f6bff', '#9b5de5', '#ff7b00'];

    let getRegions, pool, pick;
    let S = null;          // état de la partie
    let cv, ctx, W = 0, H = 0, raf = 0, resizeObs = null;

    // ---------- Écran d'accueil ----------
    function showStart() {
      stopLoop();
      const best = Game.store.get('best:jeu3', 0);
      app.innerHTML = `
        <section class="card">
          <div class="big-emoji">🏃‍♀️</div>
          <h2>La course des capitales</h2>
          <p class="rules">Une capitale s’affiche et chaque couloir porte le nom d’un pays.<br>
            Place la coureuse dans le couloir du <b>bon pays</b> avant la haie !<br>
            Bonne réponse : elle accélère. Mauvaise réponse : elle tombe et c’est fini.<br>
            ⚡ <b>Sprint</b> : appui long sur un couloir, touche le nom d’un pays en haut (ou flèche ↑) pour foncer jusqu’à la haie.
            Si c’est la bonne réponse, tu gagnes des <b>points bonus</b> : plus tu sprintes tôt, plus tu en gagnes !<br>
            📱 Touche un couloir &nbsp;·&nbsp; 💻 Flèches ← → ↑</p>
          <div id="settings"></div>
          <p class="best">${best ? `🏆 Record : ${best} points` : ''}</p>
          <button class="btn primary big" id="go">Partez !</button>
          <p class="error-msg" id="err"></p>
        </section>`;
      getRegions = Game.regionPicker($('#settings'));
      $('#go').onclick = start;
    }

    // ---------- Partie ----------
    function start() {
      pool = Data.capitalPool(getRegions());
      if (pool.length < 3) { $('#err').textContent = 'Choisis au moins un continent !'; return; }
      pick = Game.makePicker(pool);

      app.innerHTML = `
        <section class="run">
          <div class="run-q"><span class="lbl">Quel pays a pour capitale…</span><b id="cap"></b></div>
          <div class="run-body">
            <aside class="run-side">
              <div class="hud-item"><span class="lbl">📏 Distance</span><b id="dist">0 m</b></div>
              <div class="hud-item"><span class="lbl">⚡ Bonus</span><b id="bonus">0</b></div>
              <div class="hud-item"><span class="lbl">🏆 Record</span><b id="rec"></b></div>
            </aside>
            <div class="track-col">
              <div class="track-wrap" id="track"><canvas id="cv"></canvas></div>
            </div>
          </div>
        </section>`;
      cv = $('#cv');
      ctx = cv.getContext('2d');
      const best = Game.store.get('best:jeu3', 0);
      $('#rec').textContent = best ? best + ' pts' : '–';

      S = {
        dist: 0, speed: 0, targetSpeed: START_SPEED,
        lane: 1, laneX: 1,
        gateAt: FIRST_GATE, q: null, passed: [],
        phase: 'countdown', countdown: 3, fallT: 0, stepPhase: 0,
        correct: 0, review: [], best,
        flash: null, sprint: false, sprintLeft: 0, bonus: 0,
      };

      const track = $('#track');
      let holdTimer = 0;
      const cancelHold = () => clearTimeout(holdTimer);
      track.onpointerdown = (e) => {
        const r = cv.getBoundingClientRect();
        const trackX = r.width * GRASS, laneW = (r.width * (1 - 2 * GRASS)) / 3;
        setLane(Math.max(0, Math.min(2, Math.floor((e.clientX - r.left - trackX) / laneW))));
        // Toucher le nom d'un pays (en haut) = choisir ce couloir ET sprinter.
        if (e.clientY - r.top < LABEL_TOP + labelBoxH() + 6) sprint();
        // Appui long sur un couloir = sprint aussi.
        cancelHold();
        holdTimer = setTimeout(sprint, LONG_PRESS_MS);
      };
      track.onpointerup = track.onpointercancel = track.onpointerleave = cancelHold;
      track.oncontextmenu = (e) => e.preventDefault();

      newQuestion();
      resizeObs = new ResizeObserver(resize);
      resizeObs.observe($('#track'));
      resize();
      let last = performance.now();
      const loop = (t) => {
        const dt = Math.min(0.05, (t - last) / 1000);
        last = t;
        update(dt);
        draw();
        if (S && S.phase !== 'over') raf = requestAnimationFrame(loop);
      };
      raf = requestAnimationFrame(loop);
    }

    function stopLoop() {
      cancelAnimationFrame(raf);
      if (resizeObs) { resizeObs.disconnect(); resizeObs = null; }
    }

    function resize() {
      const r = $('#track').getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      W = r.width; H = r.height;
      cv.width = Math.round(W * dpr);
      cv.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }

    function newQuestion() {
      const c = pick();
      const options = Game.shuffle([c, ...Game.pickDistractors(c, pool, 2, (x) => x.name)]);
      S.q = { country: c, options, correct: options.indexOf(c), at: S.gateAt };
      $('#cap').textContent = c.capital;
    }

    function setLane(i) {
      if (!S || (S.phase !== 'run' && S.phase !== 'countdown')) return;
      S.lane = i;
    }

    // Sprint jusqu'à la prochaine haie. Le bonus = mètres restants au moment du sprint.
    function sprint() {
      if (!S || S.phase !== 'run' || S.sprint) return;
      S.sprint = true;
      S.sprintLeft = Math.max(0, S.q.at - S.dist);
    }

    document.addEventListener('keydown', (e) => {
      if (!S) return;
      if (e.key === 'ArrowLeft') { setLane(Math.max(0, S.lane - 1)); e.preventDefault(); }
      else if (e.key === 'ArrowRight') { setLane(Math.min(2, S.lane + 1)); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { sprint(); e.preventDefault(); }
      else if (['1', '2', '3'].includes(e.key)) setLane(Number(e.key) - 1);
    });

    function update(dt) {
      if (S.phase === 'countdown') {
        S.countdown -= dt;
        if (S.countdown <= 0) S.phase = 'run';
      } else if (S.phase === 'run') {
        const target = S.sprint ? S.targetSpeed * SPRINT : S.targetSpeed;
        S.speed += (target - S.speed) * Math.min(1, dt * (S.sprint ? 4 : 1.5));
        S.dist += S.speed * dt;
        S.stepPhase += S.speed * dt * 1.6;
        if (S.dist >= S.gateAt) crossGate();
      } else if (S.phase === 'fall') {
        S.fallT += dt;
        S.speed = Math.max(0, S.speed - dt * 25);
        S.dist += S.speed * dt;
        if (S.fallT > 1.8) { gameOver(); return; }
      }
      S.laneX += (S.lane - S.laneX) * Math.min(1, dt * 12);
      if (S.flash) { S.flash.t -= dt; if (S.flash.t <= 0) S.flash = null; }

      $('#dist').textContent = Math.floor(S.dist) + ' m';
      $('#bonus').textContent = S.bonus;
    }

    function crossGate() {
      const q = S.q;
      const ok = S.lane === q.correct;
      const result = { ...q, chosen: S.lane };
      S.passed.push(result);
      const sprinted = S.sprint;
      S.sprint = false; // la vitesse du sprint s'arrête à la haie
      if (ok) {
        S.correct++;
        S.targetSpeed = Math.min(MAX_SPEED, S.targetSpeed * SPEED_UP);
        S.flash = { text: 'Bravo ! ' + q.country.capital + ' → ' + q.country.name, color: '#1fb36b', t: 1.4 };
        if (sprinted) {
          const pts = Math.max(1, Math.round(S.sprintLeft));
          S.bonus += pts;
          S.flash.sub = '⚡ +' + pts + ' bonus';
        }
        Game.Sound.play('good');
        S.gateAt += GATE_SPACING;
        newQuestion();
      } else {
        S.phase = 'fall';
        S.review.push({ left: esc(q.country.capital), right: esc(q.country.name) });
        S.failed = result;
        Game.Sound.play('fall');
      }
    }

    function gameOver() {
      S.phase = 'over';
      stopLoop();
      const distance = Math.floor(S.dist);
      const total = distance + S.bonus;
      const record = total > S.best;
      if (record) Game.store.set('best:jeu3', total);
      Game.Sound.play('end');
      const f = S.failed;
      app.innerHTML = `
        <section class="card">
          <div class="big-emoji">💥</div>
          <h2>Oups, la chute !</h2>
          <div class="final-score">${total}</div>
          <div class="final-unit">points</div>
          ${record ? '<div class="record">🏆 Nouveau record !</div>' : (S.best ? `<p class="best">🏆 Record : ${S.best} points</p>` : '')}
          <div class="stats">
            <span>📏 ${distance} m</span>
            <span>⚡ ${S.bonus} bonus</span>
            <span>✅ ${S.correct} bonne${S.correct > 1 ? 's' : ''} réponse${S.correct > 1 ? 's' : ''}</span>
          </div>
          <p class="fail-msg">🏛️ ${esc(f.country.capital)} → <b>${esc(f.country.name)}</b><br>
            Tu avais choisi : ${esc(f.options[f.chosen].name)}</p>
          <div class="btn-row"><button class="btn primary big" id="again">Rejouer</button></div>
          <div class="btn-row">
            <button class="btn ghost" id="settings-btn">Changer les réglages</button>
            <a class="btn ghost" href="index.html">Menu</a>
          </div>
        </section>`;
      $('#again').onclick = start;
      $('#settings-btn').onclick = showStart;
      S = null;
    }

    // ---------- Dessin ----------
    function draw() {
      if (!S || !W || !H) return;
      const ppm = H / VIEW_METERS;
      const runnerY = H * RUNNER_Y;
      const trackX = W * GRASS;
      const trackW = W - 2 * trackX;
      const laneW = trackW / 3;
      const yOf = (m) => runnerY - (m - S.dist) * ppm;

      // Herbe rayée
      ctx.fillStyle = '#5cb85c';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#52a852';
      const stripe = 5;
      for (let m = Math.floor((S.dist - 10) / stripe) * stripe; yOf(m) > -ppm * stripe; m += stripe) {
        if (Math.round(m / stripe) % 2 === 0) ctx.fillRect(0, yOf(m + stripe), W, stripe * ppm);
      }

      // Piste
      ctx.fillStyle = '#d4623e';
      ctx.fillRect(trackX, 0, trackW, H);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      for (let i = 0; i <= 3; i++) {
        const x = trackX + i * laneW;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      }

      // Marques de distance tous les 10 m
      ctx.font = '600 11px Fredoka, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let m = Math.ceil((S.dist - 10) / 10) * 10; yOf(m) > -20; m += 10) {
        const y = yOf(m);
        if (y > H + 20) continue;
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        for (let i = 0; i < 3; i++) ctx.fillRect(trackX + i * laneW + laneW * 0.42, y - 1, laneW * 0.16, 2);
        if (m > 0 && trackX > 18) {
          ctx.fillStyle = '#fff';
          ctx.save();
          ctx.translate(trackX / 2, y);
          ctx.rotate(-Math.PI / 2);
          ctx.fillText(m + ' m', 0, 0);
          ctx.restore();
        }
      }

      // Ligne de départ
      if (yOf(0) < H + 10) drawCheckered(trackX, yOf(0), trackW, 10);

      // Haies déjà franchies puis haie actuelle
      S.passed = S.passed.filter((g) => yOf(g.at) < H + 80);
      S.passed.forEach((g) => drawHurdles(g, yOf(g.at), trackX, laneW, true));
      if (S.phase !== 'fall') drawHurdles(S.q, yOf(S.q.at), trackX, laneW, false);

      // Coureuse
      const size = Math.min(laneW * 0.42, 64);
      const rx = trackX + (S.laneX + 0.5) * laneW;
      const fall = S.phase === 'fall' ? Math.min(1, S.fallT / 0.35) : 0;
      if (S.sprint) drawSpeedLines(rx, runnerY, size);
      drawRunner(rx, runnerY, size * jumpScale(), S.stepPhase, fall);

      // Noms des pays, fixes en haut de l'écran
      drawLabels(S.phase === 'fall' ? S.failed : S.q, trackX, laneW, S.phase === 'fall');

      // Compte à rebours
      if (S.phase === 'countdown') {
        const n = Math.ceil(S.countdown);
        bigText(n > 0 ? String(n) : 'Partez !', W / 2, H * 0.4, Math.min(W, H) * 0.22, '#fff');
      }
      if (S.flash) {
        ctx.globalAlpha = Math.min(1, S.flash.t * 2);
        bigText(S.flash.text, W / 2, H * 0.3, Math.min(26, W / 16), S.flash.color);
        if (S.flash.sub) bigText(S.flash.sub, W / 2, H * 0.3 + 36, Math.min(30, W / 13), '#ffd23f');
        ctx.globalAlpha = 1;
      }
      if (S.phase === 'fall') {
        bigText('Aïe !', W / 2, H * 0.4, Math.min(W, H) * 0.16, '#ec4747');
      }
    }

    function bigText(text, x, y, size, color) {
      ctx.font = `700 ${size}px Fredoka, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = Math.max(3, size / 8);
      ctx.strokeStyle = 'rgba(31,37,71,0.85)';
      ctx.lineJoin = 'round';
      ctx.strokeText(text, x, y);
      ctx.fillStyle = color;
      ctx.fillText(text, x, y);
    }

    function drawCheckered(x, y, w, h) {
      const n = Math.max(6, Math.round(w / h));
      const cw = w / n;
      for (let r = 0; r < 2; r++) {
        for (let i = 0; i < n; i++) {
          ctx.fillStyle = (i + r) % 2 ? '#222' : '#fff';
          ctx.fillRect(x + i * cw, y - h + r * (h / 2), cw, h / 2);
        }
      }
    }

    // Petit saut : la coureuse grossit un peu en passant au-dessus d'une haie.
    function jumpScale() {
      const hurdles = [S.q.at].concat(S.passed.filter((g) => g.chosen === g.correct).map((g) => g.at));
      for (const at of hurdles) {
        const d = S.dist - at + 1.5;
        if (d > 0 && d < 3 && (S.phase !== 'fall' || S.dist < at)) return 1 + 0.3 * Math.sin((Math.PI * d) / 3);
      }
      return 1;
    }

    // Une haie par couloir (vue de dessus) : deux poteaux et une barre rayée de la couleur du couloir.
    function drawHurdles(g, y, trackX, laneW, passed) {
      if (y < -40 || y > H + 40) return;
      const barH = Math.max(7, Math.min(12, H * 0.015));
      for (let i = 0; i < 3; i++) {
        let color = LANE_COLORS[i];
        if (passed) color = i === g.correct ? '#1fb36b' : (i === g.chosen ? '#ec4747' : '#9aa0b8');
        const x = trackX + i * laneW + laneW * 0.12;
        const w = laneW * 0.76;
        // ombre
        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        ctx.fillRect(x + 3, y - barH / 2 + 5, w, barH);
        // barre blanche à rayures
        ctx.fillStyle = '#fff';
        ctx.fillRect(x, y - barH / 2, w, barH);
        ctx.fillStyle = color;
        const n = 5;
        for (let k = 0; k < n; k += 2) ctx.fillRect(x + (k * w) / n, y - barH / 2, w / n, barH);
        ctx.strokeStyle = 'rgba(31,37,71,0.5)';
        ctx.lineWidth = 1;
        ctx.strokeRect(x, y - barH / 2, w, barH);
        // poteaux
        ctx.fillStyle = '#3a3f5c';
        const post = barH * 0.9;
        ctx.fillRect(x - post / 2, y - post / 2 + barH * 0.9, post, post);
        ctx.fillRect(x + w - post / 2, y - post / 2 + barH * 0.9, post, post);
      }
    }

    // Traînées blanches derrière la coureuse pendant un sprint.
    function drawSpeedLines(x, y, s) {
      const t = performance.now() / 60;
      ctx.strokeStyle = 'rgba(255,255,255,0.75)';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      [-0.35, 0, 0.35].forEach((dx, i) => {
        const len = s * (0.8 + 0.4 * Math.sin(t + i * 2));
        ctx.beginPath();
        ctx.moveTo(x + dx * s, y + s * 0.55);
        ctx.lineTo(x + dx * s, y + s * 0.55 + len);
        ctx.stroke();
      });
    }

    const LABEL_TOP = 8;
    const labelBoxH = () => Math.max(42, Math.min(70, H * 0.1));

    // Les 3 pays affichés en haut de chaque couloir (les toucher déclenche le sprint).
    function drawLabels(g, trackX, laneW, passed) {
      const boxH = labelBoxH();
      const top = LABEL_TOP;
      for (let i = 0; i < 3; i++) {
        let color = LANE_COLORS[i];
        if (passed) color = i === g.correct ? '#1fb36b' : (i === g.chosen ? '#ec4747' : '#9aa0b8');
        const x = trackX + i * laneW + 4;
        const w = laneW - 8;
        roundRect(x, top, w, boxH, 8);
        ctx.fillStyle = color;
        ctx.fill();
        const sprinting = !passed && S.sprint && i === S.lane;
        ctx.strokeStyle = sprinting ? '#ffd23f' : 'rgba(255,255,255,0.9)';
        ctx.lineWidth = sprinting ? 5 : 2;
        ctx.stroke();
        const { lines, size } = fitText((sprinting ? '⚡' : '') + g.options[i].name, w - 8, boxH - 6, 18);
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const lh = size * 1.12;
        lines.forEach((l, k) => ctx.fillText(l, x + w / 2, top + boxH / 2 + (k - (lines.length - 1) / 2) * lh));
      }
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // Coupe le texte sur plusieurs lignes et réduit la police jusqu'à ce qu'il tienne.
    function fitText(text, maxW, maxH, base) {
      const tokens = text.split(' ').flatMap((w) => w.replace(/-/g, '-\n').split('\n'));
      let best = null;
      for (let size = base; size >= 8; size--) {
        ctx.font = `700 ${size}px Fredoka, sans-serif`;
        const lines = [];
        let cur = '';
        tokens.forEach((t) => {
          const joined = cur ? (cur.endsWith('-') ? cur + t : cur + ' ' + t) : t;
          if (cur && ctx.measureText(joined).width > maxW) { lines.push(cur); cur = t; } else cur = joined;
        });
        lines.push(cur);
        best = { lines, size };
        if (lines.length * size * 1.12 <= maxH && lines.every((l) => ctx.measureText(l).width <= maxW)) break;
      }
      return best;
    }

    // Coureuse vue de dessus, qui court vers le haut de l'écran.
    function drawRunner(x, y, s, phase, fall) {
      ctx.save();
      ctx.translate(x, y);
      // ombre
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.beginPath();
      ctx.ellipse(s * 0.08, s * 0.1, s * 0.45, s * 0.32, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.rotate(fall * 1.45);
      const swing = fall ? 0 : Math.sin(phase);
      const limb = (lx, ly, len, color) => {
        ctx.strokeStyle = color;
        ctx.lineWidth = s * 0.16;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(lx, 0);
        ctx.lineTo(lx, ly * len);
        ctx.stroke();
      };
      // jambes (short bleu, peau)
      limb(-s * 0.14, swing, s * 0.55, '#f2c29b');
      limb(s * 0.14, -swing, s * 0.55, '#f2c29b');
      // bras opposés aux jambes
      limb(-s * 0.36, -swing, s * 0.38, '#f2c29b');
      limb(s * 0.36, swing, s * 0.38, '#f2c29b');
      // maillot
      ctx.fillStyle = '#ff4f8b';
      ctx.beginPath();
      ctx.ellipse(0, 0, s * 0.34, s * 0.2, 0, 0, Math.PI * 2);
      ctx.fill();
      // queue de cheval qui se balance
      ctx.fillStyle = '#7a4a22';
      ctx.beginPath();
      ctx.ellipse(swing * s * 0.06, s * 0.2, s * 0.07, s * 0.14, swing * 0.3, 0, Math.PI * 2);
      ctx.fill();
      // tête et cheveux
      ctx.beginPath();
      ctx.arc(0, -s * 0.02, s * 0.17, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffd23f';
      ctx.fillRect(-s * 0.17, -s * 0.06, s * 0.34, s * 0.05);
      ctx.restore();

      // étoiles quand elle tombe
      if (fall) {
        ctx.font = `${Math.round(s * 0.35)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const t = performance.now() / 300;
        for (let i = 0; i < 3; i++) {
          const a = t + (i * Math.PI * 2) / 3;
          ctx.fillText('⭐', x + Math.cos(a) * s * 0.6, y - s * 0.2 + Math.sin(a) * s * 0.25);
        }
      }
    }

    Game.initMuteButton();
    showStart();
  </script>
